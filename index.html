<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FuryZ</title>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --nameColor: #ffffff;
    --nameColor25: rgba(255,255,255,0.25);
    --descriptionColor: #ffffff;
    --backgroundColor: rgba(0,0,0,0.4);
    --iconColor: #ffffff;
    --backgroundBlur: 3px;
    --nameGlow: 0px 0px 16.5px #ffffff;
    --descriptionGlow: 0px 0px 16.5px #ffffff;
    --discordBackground: rgba(0,0,0,0.2);
    --discordBorder: rgba(0,0,0,0.1);
    --discordDescription: rgba(255,255,255,0.7);
    --borderRadius: 25px;
    --bioWidth: 730px;
    --iconGlow: drop-shadow(#ffffff 1px 0 7px);
    --badgeColor: #ffffff;
    --badgeGlow: drop-shadow(#ffffff 1px 0 7px);
    --avatarRadius: 32.5%;
  }

  * { font-family: 'Pixelify Sans', sans-serif; }

  ::selection { background: #ffffff; color: #010101; }

  html, body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    background: #000;
  }

  .background {
    position: fixed;
    inset: 0;
    background: url('background.gif') center/cover no-repeat;
    z-index: 0;
  }

  .overlay_audio {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 0.3s;
  }
  .overlay_audio p {
    color: #fff;
    font-size: 22px;
    letter-spacing: 2px;
    text-shadow: 0 0 15px #fff;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; } 50% { opacity:0.4; }
  }

  .page-center {
    position: relative;
    z-index: 10;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .bio-container {
    width: 100%;
    max-width: var(--bioWidth);
  }

  .bio-card {
    background: var(--backgroundColor);
    backdrop-filter: blur(var(--backgroundBlur));
    -webkit-backdrop-filter: blur(var(--backgroundBlur));
    border-radius: var(--borderRadius);
    border: 1px solid rgba(255,255,255,0.1);
    padding: 28px 28px 22px;
    position: relative;
    animation: fadeInUp 0.6s ease both;
  }

  @keyframes fadeInUp {
    from { opacity:0; transform: translateY(24px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .top-row {
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }

  .avatar-wrap {
    flex-shrink: 0;
    position: relative;
  }

  .no-save {
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    pointer-events: auto;
  }

  .avatar-wrap img {
    width: 190px;
    height: 190px;
    border-radius: var(--avatarRadius);
    border: 2px solid rgba(255,255,255,0.3);
    object-fit: cover;
    display: block;
  }

  .user-info { flex: 1; min-width: 0; }

  .username {
      font-size: 28px;
      font-weight: 700;
      text-shadow: var(--nameGlow);
      line-height: 1.1;
      margin-bottom: 6px;
      display: flex;
      gap: 2px;
      color: #fff;
  }

  .username span {
      display: inline-block;
      animation: waveJump 1.6s ease-in-out infinite;
  }

  @keyframes waveJump {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
  }

  .username span:nth-child(1) { animation-delay: 0s; }
  .username span:nth-child(2) { animation-delay: 0.1s; }
  .username span:nth-child(3) { animation-delay: 0.2s; }
  .username span:nth-child(4) { animation-delay: 0.3s; }
  .username span:nth-child(5) { animation-delay: 0.4s; }

  .bio-desc {
    color: var(--descriptionColor);
    font-size: 20px;
    line-height: 1.6;
    text-shadow: var(--descriptionGlow);
    margin-bottom: 20px;
    white-space: pre-line;
  }

  .social-icons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .social-icons a,
  .social-icons button {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s, filter 0.2s;
    filter: var(--iconGlow);
    position: relative;
  }
  .social-icons a:hover,
  .social-icons button:hover {
    background: rgba(255,255,255,0.22);
    transform: scale(1.12);
    filter: drop-shadow(#ffffff 0 0 8px);
  }
  .social-icons svg { width: 18px; height: 18px; }

  .small-info {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--nameColor);
    font-size: 13px;
    position: relative;
  }
  .info-item svg { width: 14px; height: 14px; flex-shrink:0; }

  .social-icons [data-tooltip]::after {
      top: 125%;
      bottom: auto;
      transform: translateX(-50%) translateY(-6px);
  }

  .social-icons [data-tooltip]::before {
      top: 115%;
      bottom: auto;
      transform: translateX(-50%) translateY(-6px);
      border-top-color: transparent;
      border-bottom-color: rgba(0,0,0,0.85);
  }

  .social-icons [data-tooltip]:hover::after,
  .social-icons [data-tooltip]:hover::before {
      transform: translateX(-50%) translateY(0);
  }

  [data-tooltip]::before {
      display: none;
  }

  #viewsItem[data-tooltip]::after,
  #locationItem[data-tooltip]::after {
      top: 125%;
      bottom: auto;
      transform: translateX(-50%) translateY(-6px);
  }

  #viewsItem[data-tooltip]::before,
  #locationItem[data-tooltip]::before {
      top: 115%;
      bottom: auto;
      transform: translateX(-50%) translateY(-6px);
      border-top-color: transparent;
      border-bottom-color: rgba(0,0,0,0.85);
  }

  #viewsItem[data-tooltip]:hover::after,
  #viewsItem[data-tooltip]:hover::before,
  #locationItem[data-tooltip]:hover::after,
  #locationItem[data-tooltip]:hover::before {
      transform: translateX(-50%) translateY(0);
  }

  [data-tooltip]::after {
    content: attr(data-tooltip);
    position: absolute;
    left: 50%;
    bottom: 125%;
    transform: translateX(-50%) translateY(6px);
    padding: 6px 10px;
    border-radius: 10px;
    font-size: 12px;
    color: #fff;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 60;
  }
  [data-tooltip]::before {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 115%;
    transform: translateX(-50%) translateY(6px);
    border: 6px solid transparent;
    border-top-color: rgba(0,0,0,0.85);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    z-index: 60;
  }
  [data-tooltip]:hover::after,
  [data-tooltip]:hover::before {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .info-divider {
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.25);
  }

  /* Copied toast */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(0,0,0,0.8);
    color: #fff;
    padding: 8px 20px;
    border-radius: 20px;
    font-size: 13px;
    border: 1px solid rgba(255,255,255,0.2);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
    pointer-events: none;
  }

  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .audio-ctrl {
    position: fixed;
    bottom: 16px;
    right: 16px;
    z-index: 9999;

    width: 40px;
    height: 40px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    cursor: pointer;

    transition: background 0.2s;
  }

  .audio-ctrl:hover {
    background: rgba(255,255,255,0.15);
  }

  .audio-ctrl:hover {
    background: rgba(255,255,255,0.15);
  }

  .audio-ctrl:hover {
    background: rgba(255,255,255,0.15);
  }

  @media (max-width: 500px) {
    .top-row { flex-direction: column; }
    .avatar-wrap img { width: 120px; height: 120px; }
    .username { font-size: 22px; }
  }

  .video-section {
    min-height: 80vh;
    padding: 80px 10%;
    display: flex;
    gap: 40px;
    align-items: center;
    background: var(--backgroundColor);
    backdrop-filter: blur(var(--backgroundBlur));
    -webkit-backdrop-filter: blur(var(--backgroundBlur));
    border-radius: var(--borderRadius);
    border: 1px solid rgba(255, 255, 255, 0.1);
    margin: 0 100px 100px;
  }

  .video-box {
    width: 48%;
    aspect-ratio: 16 / 9;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(5px);
  }

  .video-box iframe {
    width: 100%;
    height: 100%;
  }

  @media (max-width: 1280px) {
    .video-section {
      margin: 0 40px 80px;
      padding: 60px 5%;
      gap: 20px;
    }
  }

  /* mobile fix */
  @media (max-width: 800px) {
    .video-section {
      flex-direction: column;
      margin: 0 16px 80px;
      padding: 30px 16px;
    }

    .video-box {
      width: 100%;
    }
  }

  .scroll-hint {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    color: rgba(255,255,255,1);
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 20px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(3px);
    z-index: 80;
    animation: floatHint 1.5s ease-in-out infinite;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  .scroll-hint.hint-top {
    bottom: auto;
    top: 20px;
  }

  @keyframes floatHint {
    0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.8; }
    50% { transform: translateX(-50%) translateY(-8px); opacity: 0.4; }
  }

  @keyframes popOut {
    from { transform: translateX(-50%) scale(1); opacity: 0.8; }
    to { transform: translateX(-50%) scale(0.6); opacity: 0; }
  }

  .scroll-hint.hint-hide {
    animation: popOut 0.4s cubic-bezier(0.36, 0, 0.66, -0.56) forwards !important;
  }

  @keyframes sectionIn {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes sectionInUp {
    from { opacity: 0; transform: translateY(-40px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes videoIn {
    from { opacity: 0; transform: scale(0.94) translateY(30px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .section-anim-down {
    animation: sectionIn 0.5s cubic-bezier(0.25, 0.8, 0.35, 1) both;
  }
  .section-anim-up {
    animation: sectionInUp 0.5s cubic-bezier(0.25, 0.8, 0.35, 1) both;
  }

  .video-box {
    opacity: 0;
    transform: translateY(60px) scale(0.88);
    transition: opacity 0.5s cubic-bezier(0.34, 1.56, 0.64, 1),
    transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }
  .video-box.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .video-box.right {
    transition-delay: 0.15s;
  }
  .video-box.left {
    transition-delay: 0.15s;
  }

  @keyframes sectionOut {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-50px) scale(0.96); }
  }
  .section-anim-out {
    animation: sectionOut 0.4s cubic-bezier(0.25, 0.8, 0.35, 1) both;
    pointer-events: none;
  }

</style>
</head>

  <div class="video-box left">
    <iframe src="https://www.youtube.com/embed/YfNz5Au14Qg"
            allowfullscreen></iframe>
  </div>

  <div class="video-box right">
    <iframe src="https://www.youtube.com/embed/vIgArtxv0YE"
            allowfullscreen></iframe>
  </div>
</div>
<script>
  document.addEventListener('contextmenu', (e) => {
    if (e.target?.closest?.('.no-save')) e.preventDefault();
  });
  document.addEventListener('dragstart', (e) => {
    if (e.target?.closest?.('.no-save')) e.preventDefault();
  });
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && ['s','c'].includes(e.key?.toLowerCase())) e.preventDefault();
  });

  const overlayEl  = document.getElementById('overlay_audio');
  const audioEl    = document.getElementById('audio');
  const audioBtn   = document.getElementById('audio-btn');
  const audioIcon  = document.getElementById('audio-icon');

  overlayEl.addEventListener('click', () => {
    overlayEl.style.opacity = '0';
    setTimeout(() => overlayEl.style.display = 'none', 300);
    audioEl.volume = 0.5;
    audioEl.play().catch(() => {});
    audioBtn.style.display = 'flex';
  });

  audioBtn.addEventListener('click', () => {
    if (audioEl.paused) { audioEl.play(); audioIcon.className = 'fa fa-pause'; }
    else                { audioEl.pause(); audioIcon.className = 'fa fa-play'; }
  });

  function copyText(text) {
    navigator.clipboard.writeText(text).catch(() => {});
    showToast('Copied: ' + text);
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  const titleText = "@FuryZ";
  let idx = 0, deleting = false;
  function typeWriter() {
    document.title = deleting ? titleText.slice(0, idx--) : titleText.slice(0, ++idx);
    if (!deleting && idx === titleText.length) deleting = true;
    else if (deleting && idx === 0) deleting = false;
    setTimeout(typeWriter, 350);
  }
  typeWriter();

  const SECTIONS  = ['.page-center', '.video-section'];
  const SNAP_MS   = 480;
  const EASING    = 'cubic-bezier(0.25, 0.8, 0.35, 1)';

  let snapping    = false;
  let currentIdx  = 0;
  let touchStartY = 0;

  function getSectionEls() {
    return SECTIONS.map(sel => document.querySelector(sel)).filter(Boolean);
  }

  function snapTo(idx, direction) {
    const els = getSectionEls();
    if (!els[idx]) return;
    snapping   = true;
    currentIdx = idx;

    const hint = document.getElementById('scrollHint');

    function updateHint() {
      if (currentIdx === 0) {
        hint.classList.remove('hint-hide', 'hint-top');
        hint.style.display = 'block';
        setTimeout(() => hint.style.opacity = '0.8', 10);
      } else {
        hint.classList.add('hint-top');
        hint.classList.remove('hint-hide');
        hint.style.display = 'block';
        hint.style.opacity = '0.8';
      }
    }

    updateHint();

    const target   = els[idx].getBoundingClientRect().top + window.scrollY;
    const start    = performance.now();
    const fromY    = window.scrollY;
    const distance = target - fromY;

    const animClass = direction >= 0 ? 'section-anim-down' : 'section-anim-up';
    els[idx].classList.remove('section-anim-down', 'section-anim-up');
    void els[idx].offsetWidth;
    els[idx].classList.add(animClass);

    if (idx === 1) {
      document.querySelectorAll('.video-box').forEach(box => {
        box.classList.remove('visible');
      });
      setTimeout(() => {
        document.querySelectorAll('.video-box').forEach(box => {
          box.classList.add('visible');
        });
      }, 100);
    }

    if (Math.abs(distance) < 4) { snapping = false; return; }

    window.scrollTo(0, fromY);

    function tick(now) {
      const elapsed  = now - start;
      const progress = Math.min(elapsed / SNAP_MS, 1);
      const ease     = 1 - Math.pow(1 - progress, 3);
      window.scrollTo(0, fromY + distance * ease);
      if (progress < 1) requestAnimationFrame(tick);
      else snapping = false;
    }
    requestAnimationFrame(tick);
    setTimeout(updateHint, SNAP_MS);
  }

  function handleDirection(direction) {
    if (snapping) return;
    const els = getSectionEls();
    const next = currentIdx + direction;
    if (next >= 0 && next < els.length) snapTo(next, direction);
  }

  const iframes = document.querySelectorAll('.video-box iframe');
  let iframeTimer;

  function lockIframes() {
    iframes.forEach(f => f.style.pointerEvents = 'none');
  }
  function unlockIframes() {
    iframes.forEach(f => f.style.pointerEvents = 'auto');
  }

  lockIframes();

  let wheelAccum = 0;
  const WHEEL_THRESHOLD = 40;
  let hintMoveTimeout;
  const hint = document.getElementById('scrollHint');

  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (snapping) return;

    lockIframes();
    clearTimeout(iframeTimer);
    iframeTimer = setTimeout(unlockIframes, 800);

    // Apply countermotion to hint: scroll down moves it up, scroll up moves it down
    const isScrollingDown = e.deltaY > 0;
    const moveOffset = isScrollingDown ? -12 : 12; // Move opposite to scroll direction
    hint.style.transform = `translateX(-50%) translateY(${moveOffset}px)`;

    // Reset transform after scroll activity stops
    clearTimeout(hintMoveTimeout);
    hintMoveTimeout = setTimeout(() => {
      hint.style.transform = 'translateX(-50%) translateY(0)';
    }, 800);

    wheelAccum += e.deltaY;
    if (Math.abs(wheelAccum) >= WHEEL_THRESHOLD) {
      handleDirection(wheelAccum > 0 ? 1 : -1);
      wheelAccum = 0;
    }
  }, { passive: false });

  const SUPABASE_URL = "https://fuzfzrwgyfrmqbownrvz.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1emZ6cndneWZybXFib3ducnZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjE4NzgsImV4cCI6MjA5MTMzNzg3OH0.gqbgrSSzL5Ce3uOHyNNJeQsEJYN119ULvyi0kSc5WS0";

  async function updateViews() {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/profile_views?id=eq.1`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      }
    });

    const data = await res.json();
    let count = data[0].count;

    count++;

    await fetch(`${SUPABASE_URL}/rest/v1/profile_views?id=eq.1`, {
      method: "PATCH",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`
      },
      body: JSON.stringify({ count })
    });

    document.getElementById("viewsCount").textContent = count;
  }

  updateViews();
</script>
</body>
</html>
