<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio — Gallery</title>
  <meta name="description" content="Full photo gallery from tournaments and events." />
  <link rel="icon" href="me.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-gif"></div>
    <div class="bg-overlay"></div>
    <div class="bg-gradient"></div>
  </div>

  <header class="nav">
    <a href="index.html#top" class="nav__brand">
      <span class="nav__logo-dot"></span>
      <span>portfolio</span>
    </a>
    <nav class="nav__links">
      <a href="index.html#home" class="nav__link">Home</a>
      <a href="index.html#contact" class="nav__link">Contact</a>
      <a href="index.html#location" class="nav__link">Location</a>
      <a href="gallery.html" class="nav__link active">Gallery</a>
      <a href="highlights.html" class="nav__link">Videos</a>
    </nav>
    <div class="nav__actions">
      <button id="navToggle" class="icon-btn nav__hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main id="top">
    <section class="section section--head-only">
      <div class="container">
        <header class="section__head reveal">
          <span class="eyebrow">Gallery</span>
          <h1 class="section__title">Full <span class="gradient-text">photo collection</span></h1>
          <p class="section__sub">Every moment from tournaments and events — click any photo to view its details.</p>
        </header>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="gallery" id="galleryGrid" data-full="true">
        </div>

        <div class="gallery__back">
          <a href="index.html#gallery" class="btn btn--ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span>Back to home</span>
          </a>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container footer__row">
        <p>© <span id="year"></span> Trung Le. Crafted with care.</p>
        <a href="#top" class="footer__up">Back to top ↑</a>
      </div>
    </footer>
  </main>

  <!-- Music player (volume-only) -->
  <aside class="player" id="player" aria-label="Background music volume">
    <button class="player__trigger" id="playerTrigger" aria-label="Adjust volume" aria-expanded="false">
      <svg class="ico-vol-high" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
      <svg class="ico-vol-low" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <svg class="ico-vol-mute" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
      <span class="player__pulse" aria-hidden="true"></span>
    </button>
    <div class="player__panel" id="playerPanel" role="group" aria-label="Volume">
      <div class="player__vpct" id="volPct">60</div>
      <div class="vslider">
        <div class="vslider__track">
          <div class="vslider__fill" id="volFill"></div>
        </div>
        <div class="vslider__knob" id="volKnob"></div>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6" aria-label="Volume" orient="vertical" />
      </div>
    </div>
    <audio id="audio" src="want%20to%20forget%20this.mp3" preload="auto" loop autoplay></audio>
  </aside>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Modal -->
  <div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal__backdrop"></div>
    <div class="modal__dialog" role="document">
      <button class="modal__close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <button class="modal__nav modal__nav--prev" aria-label="Previous">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button class="modal__nav modal__nav--next" aria-label="Next">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="modal__media" id="modalMedia"></div>
      <div class="modal__info">
        <h3 class="modal__title" id="modalTitle"></h3>
        <p class="modal__desc" id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
